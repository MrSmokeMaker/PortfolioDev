<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styleguide – MrSmokeMaker Portfolio</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .sg-section { margin-bottom: var(--space-12); }
    .sg-colors { display: flex; flex-wrap: wrap; gap: var(--space-4); }
    .sg-color { width: 120px; height: 80px; border-radius: var(--radius-md); border: 1px solid var(--theme-border); }
    .sg-typography h1, .sg-typography h2, .sg-typography p { margin: 0 0 var(--space-4) 0; }
    .sg-cta { display: inline-block; padding: var(--space-3) var(--space-6); border-radius: var(--radius-sm); background: var(--theme-accent); color: #fff; text-decoration: none; }
  </style>
</head>
<body class="hub-theme">
  <header class="sg-header" style="padding: var(--space-6); text-align: center;">
    <h1>Portfolio Design System</h1>
  </header>
  <main class="mobbi-container">
    <section class="sg-section" id="colors">
      <h2>Цвета</h2>
      <div class="sg-colors">
        <div class="sg-color" style="background: var(--theme-bg);" title="bg"></div>
        <div class="sg-color" style="background: var(--theme-surface);" title="surface"></div>
        <div class="sg-color" style="background: var(--theme-accent);" title="accent"></div>
        <div class="sg-color" style="background: var(--theme-text); color:#fff;" title="text"></div>
      </div>
    </section>
    <section class="sg-section" id="typography">
      <h2>Типографика</h2>
      <div class="sg-typography">
        <h1>Заголовок H1 – Inter Bold 48px</h1>
        <h2>Заголовок H2 – Inter SemiBold 32px</h2>
        <p>Текст абзаца – Inter Regular 16px, line‑height 1.5.</p>
        <a href="#" class="sg-cta">Кнопка CTA</a>
      </div>
    </section>
    <section class="sg-section" id="components">
      <h2>Компоненты</h2>
      <div class="sg-component-card" style="padding: var(--space-6); border-radius: var(--radius-md); box-shadow: var(--theme-card-shadow);">
        <h3>Карточка</h3>
        <p>Пример текстового содержимого.</p>
        <a href="#" class="sg-cta">Подробнее</a>
      </div>
    </section>
  </main>
</body>
</html>
