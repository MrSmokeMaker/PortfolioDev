<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pwaBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    <linearGradient id="pwaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#pwaBgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" stroke="url(#pwaGoldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#pwaGoldGrad)" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.4"/>

  <!-- Inner Badge Container -->
  <rect x="86" y="86" width="340" height="340" rx="80" fill="#0B0F19" stroke="url(#pwaGoldGrad)" stroke-width="6" filter="url(#pwaGlow)"/>

  <!-- Modern Geometric Monogram SK -->
  <text x="256" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="800" font-size="140" fill="url(#pwaGoldGrad)" letter-spacing="4">SK</text>

  <!-- Accent Status Dot -->
  <circle cx="390" cy="122" r="18" fill="#10B981" stroke="#0B0F19" stroke-width="5"/>
</svg>
